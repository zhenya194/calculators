<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="res">
        <p id="result">0</p>
        <button type="submit" onclick="result()">Result</button>
    </div>
    <br><br>

    <div id="buttons num">
        <button onclick="writesymbol(1)">1</button>
        <button onclick="writesymbol(2)">2</button>
        <button onclick="writesymbol(3)">3</button>
        <br>
        <button onclick="writesymbol(4)">4</button>
        <button onclick="writesymbol(5)">5</button>
        <button onclick="writesymbol(6)">6</button>
        <br>
        <button onclick="writesymbol(7)">7</button>
        <button onclick="writesymbol(8)">8</button>
        <button onclick="writesymbol(9)">9</button>
        <br><br>
        <button onclick="writesymbol(0)">0</button>
        <br><br>
        <button onclick="writesymbol('+')">+</button>
        <button onclick="writesymbol('-')">-</button>
        <button onclick="writesymbol('*')">*</button>
        <button onclick="writesymbol('/')">/</button>
        <br><br>
        <button onclick="deletesymbol()">⌫</button>
    </div>

    <br><br>
    
    <script src="script.js" defer></script>
</body>
</html>
